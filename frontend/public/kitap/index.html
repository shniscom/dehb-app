function filt(){const q=F.q.toLocaleLowerCase('tr');return B.filter(b=>(!q||(b.t+' '+b.a+' '+b.s).toLocaleLowerCase('tr').includes(q))&&(F.st=='all'||(F.st=='in'&&!b.out)||(F.st=='out'&&b.out)||(F.st=='read'&&b.read)||(F.st=='unread'&&!b.read))&&(!F.s||b.s==F.s)&&(!F.a||b.a==F.a)).sort((x,y)=>cmp(x.a,y.a)||cmp(x.s,y.s)||cmp(x.t,y.t))}
const th=b=>b.cover?`<img class="th" src="${b.cover}">`:`<div class="th">📖</div>`;
function list(){const L=filt();$('#list').innerHTML=`<div class="lg">${L.length} kitap${F.s?' · seri: '+esc(F.s):''}${F.a?' · yazar: '+esc(F.a):''} ${(F.s||F.a)?'<a href="#" id="clr">[filtreyi kaldır]</a>':''}</div>`+L.map(b=>`<div class="row" data-id="${b.id}">${th(b)}<div class="m"><b>${esc(b.t)}${b.n>1?' ('+b.n+' adet)':''}</b><small>${esc(b.a)}${b.s?' · '+esc(b.s):''}${+b.pg?' · '+b.pg+' sf.':''}</small><div><span class="bd ${b.out?'o':'i'}">${b.out?'Verildi'+(b.out.who?': '+esc(b.out.who):'')+' · '+fd(b.out.date):'Kitaplıkta'}</span>${b.read?'<span class="bd">✓ Okundu</span>':''}</div></div></div>`).join('');
const c=$('#clr');if(c)c.onclick=e=>{e.preventDefault();F.s=F.a='';list()}}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));const v=$('#v');
if(tab=='lib'){v.innerHTML=`<input id="q" type="search" placeholder="Kitap, yazar veya seri ara…" value="${esc(F.q)}"><div class="chips">${[['all','Tümü'],['in','Kitaplıkta'],['out','Verildi'],['read','Okundu'],['unread','Okunmadı']].map(x=>`<button data-st="${x[0]}" class="${F.st==x[0]?'on':''}">${x[1]}</button>`).join('')}</div><div id="list"></div>`;
$('#q').oninput=e=>{F.q=e.target.value;list()};v.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{F.st=b.dataset.st;render()});list()}
else if(tab=='st'){const g=(k)=>{const m={};B.forEach(b=>{if(b[k])m[b[k]]=(m[b[k]]||0)+1});return Object.entries(m).sort((x,y)=>y[1]-x[1]||cmp(x[0],y[0]))};
const out=B.filter(b=>b.out).length,rd=B.filter(b=>b.read).length,pg=B.reduce((s,b)=>s+(+b.pg||0)*b.n,0),np=B.filter(b=>!+b.pg).length,A=g('a'),S=g('s');
v.innerHTML=`<div class="cards"><div class="cd"><b>${B.length}</b>Toplam kitap</div><div class="cd"><b>${B.reduce((s,b)=>s+(+b.n||1),0)}</b>Toplam adet</div><div class="cd"><b>${B.length-out}</b>Kitaplıkta</div><div class="cd"><b>${out}</b>Verildi</div><div class="cd"><b>${rd}</b>Okunan</div><div class="cd"><b>${B.length-rd}</b>Okunmayan</div><div class="cd"><b>${pg}</b>Toplam sayfa</div><div class="cd"><b>${np}</b>Sayfa sayısı girilmemiş</div></div>
<h3>Yazarlar (${A.length})</h3>${A.map(x=>`<div class="li" data-a="${esc(x[0])}"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')}<h3>Seriler (${S.length})</h3>${S.map(x=>`<div class="li" data-s="${esc(x[0])}"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')}`;
v.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{F={q:'',st:'all',s:'',a:e.dataset.a};tab='lib';render()});v.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{F={q:'',st:'all',a:'',s:e.dataset.s};tab='lib';render()})}
else if(tab=='add'){v.innerHTML=`<h3>Yeni kitap ekle</h3>${[['t','Kitap adı *'],['a','Yazar'],['s','Seri'],['pub','Yayınevi'],['pg','Sayfa sayısı'],['n','Adet']].map(x=>`<label>${x[1]}</label><input id="n_${x[0]}" ${x[0]=='pg'||x[0]=='n'?'type="number" inputmode="numeric"':''} value="${x[0]=='n'?1:''}">`).join('')}<button id="addb">Kitaplığa ekle</button>`;
$('#addb').onclick=()=>{const t=$('#n_t').value.trim();if(!t)return toast('Kitap adı gerekli');B.push({id:'b'+Date.now(),t,a:$('#n_a').value.trim()||'Yazar belirtilmemiş',s:$('#n_s').value.trim(),pub:$('#n_pub').value.trim(),pg:$('#n_pg').value,n:+$('#n_n').value||1,ed:'',sum:'',cover:'',read:false,out:null,log:[]});save();toast('Eklendi');tab='lib';F={q:'',st:'all',s:'',a:''};render()}}
else{v.innerHTML=`<h3>Bilgileri toplu getir</h3><p class="lg">Google Books'tan eksik sayfa sayısı, yayınevi, özet ve kapakları doldurur. Elle girdiklerini değiştirmez. İnternet gerekir; birkaç dakika sürer, sayfayı kapatma. Yanlış eşleşme olursa kitabın içinden düzeltebilirsin.</p><label>Google API anahtarı (isteğe bağlı)</label><input id="gk" placeholder="AIza…"><button id="bulk">🔎 Tümünü getir</button><div class="lg" id="pr"></div><h3>Yedekle / Geri yükle</h3><p class="lg">Veriler bu telefondaki tarayıcıda saklanır. Tarayıcı verisini silersen kaybolur; ara sıra aşağıdaki metni kopyalayıp bir yere kaydet.</p><button id="ex">Yedek metnini oluştur</button><textarea id="bx" rows="8" placeholder="Yedek metni burada görünür / geri yüklemek için buraya yapıştır"></textarea><button class="g" id="im">Yapıştırılan yedeği geri yükle</button>`;
$('#gk').value=localStorage.getItem('gbkey')||'';$('#gk').onchange=e=>localStorage.setItem('gbkey',e.target.value.trim());$('#bulk').onclick=bulk;$('#ex').onclick=()=>{$('#bx').value=JSON.stringify(B);$('#bx').select()};$('#im').onclick=()=>{try{const d=JSON.parse($('#bx').value);if(!Array.isArray(d))throw 0;B=d;save();toast('Geri yüklendi')}catch(e){toast('Geçersiz yedek')}}}}
function dlg(id){const b=B.find(x=>x.id==id);if(!b)return;const sh=$('#sh');
const fld=(k,l,ty)=>`<label>${l}</label><input data-k="${k}" ${ty?'type="'+ty+'"':''} value="${esc(b[k])}">`;
sh.innerHTML=`<div style="text-align:right"><button class="g" id="x">Kapat ✕</button></div>${b.cover?`<img class="cv" src="${b.cover}">`:`<div class="cv">📖</div>`}<div style="text-align:center;margin-bottom:10px"><label class="g" style="display:inline-block;border:1px solid var(--bd);padding:8px 12px;border-radius:10px">📷 Kapak fotoğrafı ekle<input id="cf" type="file" accept="image/*" style="display:none"></label></div>
<div style="text-align:center;margin-bottom:8px"><button class="g" id="gb">🔎 Bilgileri internetten getir</button></div><h2 style="margin:4px 0">${esc(b.t)}</h2>
<div style="margin:8px 0"><span class="bd ${b.out?'o':'i'}">${b.out?'Verildi: '+esc(b.out.who||'')+' · '+fd(b.out.date):'Kitaplıkta'}</span></div>
${b.out?`<label>Geri konma tarihi</label><input id="dd" type="date" value="${today()}"><button id="ret">Kitaplığa geri koy</button>`:`<label>Kime verildi (isteğe bağlı)</label><input id="who"><label>Veriliş tarihi</label><input id="dd" type="date" value="${today()}"><button id="giv">Verildi olarak işaretle</button>`}
<p><label><input type="checkbox" id="rd" ${b.read?'checked':''} style="width:auto;margin-right:8px">Okundu</label></p>
${fld('t','Kitap adı')}${fld('a','Yazar')}${fld('s','Seri')}${fld('pub','Yayınevi')}${fld('pg','Sayfa sayısı','number')}${fld('ed','Baskı (ör. 3. baskı)')}${fld('n','Adet','number')}<label>Özet / notlar</label><textarea data-k="sum" rows="5">${esc(b.sum)}</textarea>
${b.log.length?'<h4>Geçmiş</h4>'+b.log.slice().reverse().map(l=>`<div class="lg">${fd(l.d)} – ${esc(l.m)}</div>`).join(''):''}<br><button class="r" id="del">Kitabı sil</button>`;
$('#dlg').classList.add('s');const up=()=>{save();list&&tab=='lib'&&list()};
sh.querySelectorAll('[data-k]').forEach(i=>i.onchange=()=>{b[i.dataset.k]=i.type=='number'&&i.dataset.k=='n'?(+i.value||1):i.value;up()});
$('#gb').onclick=async()=>{toast('Aranıyor…');try{toast(await gb(b)?'Bilgiler eklendi':'Eşleşme bulunamadı');save();dlg(id)}catch(e){alert(e.message)}};$('#x').onclick=()=>{$('#dlg').classList.remove('s');render()};
$('#rd').onchange=e=>{b.read=e.target.checked;up()};
const g=$('#giv');if(g)g.onclick=()=>{const w=$('#who').value.trim(),d=$('#dd').value||today();b.out={who:w,date:d};b.log.push({d,m:'Verildi'+(w?' ('+w+')':'')});up();dlg(id)};
const r=$('#ret');if(r)r.onclick=()=>{const d=$('#dd').value||today();b.log.push({d,m:'Kitaplığa geri konuldu'});b.out=null;up();dlg(id)};
$('#del').onclick=()=>{if(confirm('Bu kitap silinsin mi?')){B=B.filter(x=>x!=b);save();$('#dlg').classList.remove('s');render()}};
$('#cf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=260/im.width,c=document.createElement('canvas');c.width=260;c.height=Math.round(im.height*Math.min(k,2));c.getContext('2d').drawImage(im,0,0,c.width,c.height);b.cover=c.toDataURL('image/jpeg',.7);up();dlg(id)};im.src=u}}
document.addEventListener('click',e=>{const r=e.target.closest('.row');if(r&&tab=='lib')dlg(r.dataset.id);const n=e.target.closest('nav button');if(n){tab=n.dataset.t;render()}});

const nz=s=>String(s||'').toLocaleLowerCase('tr').replace(/[çğıöşü]/g,c=>({'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u'}[c])).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const kk=()=>{try{const k=localStorage.getItem('gbkey');return k?'&key='+encodeURIComponent(k):''}catch(e){return ''}};
const sl=ms=>new Promise(r=>setTimeout(r,ms));
async function ask(q){for(let i=0;i<4;i++){let r;try{r=await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=10&q='+q+kk())}catch(e){throw new Error('Bağlantı kurulamadı (Failed to fetch).')}
if(r.ok){const d=await r.json();return (d.items||[]).map(x=>x.volumeInfo).filter(Boolean)}
if((r.status==429||r.status>=500)&&i<3){await sl(1500*Math.pow(2,i));continue}
let m='';try{m=(await r.json()).error.message}catch(e){}const e=new Error('Google yanıtı: HTTP '+r.status+' '+m);e.st=r.status;throw e}}
const sc=(b,v)=>{const w=nz(b.t).split(' ').filter(x=>x.length>1),h=' '+nz((v.title||'')+' '+(v.subtitle||''))+' ';return w.length?w.filter(x=>h.includes(' '+x)).length/w.length:0};
async function gb(b){const t=encodeURIComponent(b.t),has=b.a&&b.a!='Yazar belirtilmemiş',Q=[];
if(has)Q.push('intitle:'+t+'+inauthor:'+encodeURIComponent(b.a));Q.push('intitle:'+t);Q.push(t+(has?'+'+encodeURIComponent(b.a.split(' ').pop()):''));
let v=null;for(const q of Q){const L=await ask(q);let best=0;v=null;for(const x of L){const s=sc(b,x);if(s>best){best=s;v=x}}if(best>=0.7)break;v=null;await sl(300)}
if(!v)return false;let c=0;
if(!+b.pg&&v.pageCount){b.pg=v.pageCount;c++}if(!b.pub&&v.publisher){b.pub=v.publisher;c++}
if(!b.sum&&v.description){b.sum=v.description.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();c++}
const im=v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail);if(!b.cover&&im){b.cover=im.replace('http:','https:').replace('&edge=curl','');c++}
return c>0}
async function bulk(){const T=B.filter(b=>!+b.pg||!b.sum||!b.cover),p=$('#pr');let ok=0,er=0,nf=0,i=0,ce=0;
for(const b of T){i++;p.textContent=i+'/'+T.length+' · bulunan: '+ok+' · bulunamayan: '+nf+' · hata: '+er;
try{if(await gb(b))ok++;else nf++;ce=0}catch(e){er++;ce++;if(e.st==403||e.st==400||ce>=5){p.textContent='Durdu: '+e.message+' (bulunan: '+ok+')';save();return}}
if(i%5==0)save();await sl(700)}
save();p.textContent='Bitti. Bulunan: '+ok+', bulunamayan: '+nf+', hata: '+er+'. Hata alanlar için tekrar basabilirsin.'}
render();
</script></body></html>
